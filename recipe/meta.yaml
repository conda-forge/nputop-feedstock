{% set name = "nputop" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/a/ascend-nputop/ascend_nputop-{{ version }}.tar.gz
  sha256: 1664e9a570ef0de4e5598c2a8d6887ea9468f0398fd2df33e6281bce2f48a8ce

build:
  number: 0
  skip: true  # [win or osx]
  script: {{ PYTHON }} -m pip install . -vv --no-build-isolation --no-deps
  entry_points:
    - nputop = nputop.cli:main

requirements:
  host:
    - python >=3.7
    - pip
    - setuptools >=61
    - wheel
  run:
    - python >=3.7
    - psutil >=5.6.6
    - cachetools >=1.0.1
    - termcolor >=1.0.0

test:
  imports:
    - nputop
    - nputop.api.libdcmi
    - nputop.gui.monitor
  commands:
    - nputop --version
    - nputop --help
    - nputop --preview --version
    - nputop --legacy-ui --help
    - python -c "from nputop.version import __version__; assert __version__ == '{{ version }}'"

about:
  home: https://github.com/youyve/nputop
  license: Apache-2.0 AND GPL-3.0-only
  license_file:
    - LICENSE
    - COPYING
    - NOTICE
  summary: An interactive Ascend NPU and process monitor
  description: |
    Monitor Ascend devices and processes through DCMI or npu-smi.
    Live telemetry requires Linux and an installed Ascend driver.
  doc_url: https://github.com/youyve/nputop
  dev_url: https://github.com/youyve/nputop

extra:
  recipe-maintainers:
    - youyve
